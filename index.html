  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const saved = localStorage.getItem(LS);
if (saved) open(b64(saved)).catch(() => localStorage.removeItem(LS));
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.textContent = '正在打开…';
  try {
    const remember = document.getElementById('rm').checked;
    const raw = await derive(document.getElementById('pw').value);
    await open(raw);
    if (remember) try { localStorage.setItem(LS, btoa(String.fromCharCode(...raw))); } catch (_) {}
  } catch (err) { msg.textContent = '密码不对'; }
};
